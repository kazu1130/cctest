on:
  workflow_dispatch:
  push:
    branches:
      - testnb
permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  RUN_ID: ${{ github.event.workflow_run.id }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  LINT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  ARTIFACT_NAME: markdownlint-report
  MARKER: "<!-- md-lint-report -->"
  LABEL: "docs: lint-failed"



jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: cd ./test/ && bash ./att.sh
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2);
            console.log(process.env.ACTIONS_RESULTS_URL)

      - name: Create sample file
        run: |
          mkdir -p /tmp/cache-test
          echo "Hello from cache!" > /tmp/cache-test/hello.txt
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: /tmp/cache-test
          key: test-cache-key
          restore-keys: |
            test-cache-