name: Release

on:
  push:
    branches:
      - main
  workflow_run: # 本来はリリースタイミングでしか叩かれないが、面倒なので前のが叩かれたら発火するようにしておく
    workflows: ["PR Lint Report"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-release

      - name: Install dependencies (cache miss only)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Run myrelease
        run: npm run myrelease
