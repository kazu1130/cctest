name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-release

      - name: Install dependencies (cache miss only)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

