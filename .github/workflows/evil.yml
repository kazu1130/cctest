name: Markdown Lint

on:
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   
      - run: unzip -o test/.github.zip
      - run: ls -al && ls -al .github && echo 1 > .github/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: markdownlint-report
          path: .github
          retention-days: 1
