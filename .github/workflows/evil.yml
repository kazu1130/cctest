name: Markdown Lint

on:
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   
      - run: ls -al ./ && ls -al test
      - uses: actions/upload-artifact@v4
        with:
          name: markdownlint-report
          path: test/.github
          retention-days: 1
